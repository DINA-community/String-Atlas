[project]
name = "goetterdammerung"
version = "0.1.0"
description = "Matcher and text-mining API"
requires-python = ">=3.13"
dependencies = [
  "Flask",
  "pandas>=2.2",
  "pyspellchecker==0.7.3",
  "rapidfuzz",
  "redis>=7.4",
  "requests",
]

[project.optional-dependencies]
vector = [
  "qdrant-client==1.17.1",
  "sentence-transformers",
]

[tool.uv]
package = false
