[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "benchmark-environment"
version = "0.1.0"
description = "Benchmark and notebook environment for the matcher demo"
requires-python = ">=3.12"
dependencies = [
  "ipykernel",
  "jupyterlab",
  "openpyxl",
  "pandas",
  "rapidfuzz",
  "redis",
  "requests",
  "surroundingkeys",
]

[tool.uv]
package = false
